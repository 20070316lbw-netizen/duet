[project]
name = "duet"
version = "0.1.0"
description = "Multi-agent coding CLI — Planner + (silent) Supervisor, lobby routing, branch-aware transcript"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.79",
    "watchdog>=4.0",
    "tomli; python_version<'3.11'",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[project.scripts]
duet = "duet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duet"]

[tool.hatch.build.targets.wheel.force-include]
"duet/web/static" = "duet/web/static"
